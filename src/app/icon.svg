<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.9 66.4 358.8 358.8">
  <!--
    Marca "G" de Gotya. Vector real, exportado de Illustrator por Tiago.
    Reemplaza a los trazados a ojo anteriores, que no daban con la forma.

    Del export original se sacaron tres cosas, ninguna de dibujo:
      1. El bloque <metadata>. Illustrator mete ahi un manifiesto C2PA de
         procedencia que puede pesar DECENAS de KB — mucho mas que el dibujo,
         que es un path de ~1 KB. No aporta nada al render y se publica en el
         repo. Si re-exportas, volve a sacarlo: el bloque crecio mucho entre
         una exportacion y la siguiente.
      2. Un <rect> de 98.76 x 0.3 px en #b77455. Una astilla de Illustrator
         para tapar una costura, en un TERCER color que no es de la paleta.
         (Los exports posteriores ya no la traen.)
      3. El <style> con clases: el fill va como atributo. Este SVG lo rendea
         satori para la OG image, y cuanto menos CSS tenga, menos chance de
         que algo no le entre (CLAUDE.md 9.26: si no lo puede dibujar, no
         falla el build, sale la imagen sin la marca).

    Color: terracota #C96A3A, el token de marca (CLAUDE.md 5). El export
    traia #c4663b, cinco puntos de rojo mas oscuro: casi igual a la vista,
    pero distinto al accent del resto del sitio.

    Sin fondo, para que funcione igual en pestanas claras y oscuras.

    El viewBox NO es el del artboard original (0 0 491.52 491.52). Illustrator
    exporto la marca con 50% de margen: en la OG image la tinta quedaba en
    229px contra los ~315px que pedia el encuadre (CLAUDE.md 6), o sea 36%
    del recorte cuadrado de WhatsApp en vez de 50%. El viewBox recortado la
    encuadra sin tocar una sola coordenada del path. Deja ~16% de aire por
    lado, que es el respiro que necesita un favicon a 16px.

    Este mismo archivo alimenta el favicon Y la OG image. Si se reemplaza el
    path, volver a medir la tinta decodificando el PNG generado y reajustar
    este viewBox.
  -->
  <path
    fill="#C96A3A"
    d="M309.76,157.74h-94.16c-1.05.33-2.2.19-3.58.11-5.49,14.83-11.88,29.2-19.38,43.19-4.7,8.77-9.49,17.32-14.99,25.58l-12.74,19.12,2.58,3.96c10.07,14.51,19.3,29.5,27.41,45.24,3.81,7.41,7.45,14.68,10.5,22.4l6.47,16.32,20.21-.09c3.01-.01,5.85-.58,8.74-1.35,6.83-1.82,13.08-5.24,18.34-9.9l5.76-5.8,6.61-7.61,39.56-45.6-65.33-.02.02-35.03,122.81.02.03,140.36h-35.06s-.15-4.87-.15-4.87l.07-20.03-.02-5.82v-24.34s.04-6.1.04-6.1v-4.83s.05-11.59.05-11.59c.16-.49-.49-.63-.54-.05l-19.51,22.74-21.44,24.85c-7.59,8.8-15.24,15.62-25.53,21.06-4.06,2.15-8.02,3.96-12.48,5.29-6.41,1.91-12.9,3.51-19.71,3.54l-46.78.21-8.68-23.16c-4.88-12.13-9.96-24.01-15.94-35.61l-6.82-12.67c-4.22-7.83-9-15.1-13.94-22.53l-13.61-20.46-5.58-8.32,6.26-9.68,14.52-21.89,4.24-6.63c5.2-8.13,9.95-16.36,14.34-25,5.31-10.01,9.92-20.16,14.22-30.66l11.17-29.2,124.43.05c3.62,0,6.92.67,10.41,1.41,17.72,3.75,32.88,16.63,40.31,33.06,3.31,7.32,5.21,14.89,5.63,22.91l.14,18.66h-35.26s-.04-18-.04-18c0-2.05-.65-3.84-1.18-5.78-1.72-5.76-5.49-10.48-10.56-13.67-3.68-2.31-7.62-3.68-11.85-3.78Z"
  />
